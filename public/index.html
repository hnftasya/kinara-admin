<!DOCTYPE html>
<html lang="id">
<head>
  <link rel="icon" type="image/png" href="/favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kinara Pilates Kotwis</title>
  <meta name="description" content="Aplikasi manajemen studio Kinara Pilates — booking, jadwal, member, pembayaran.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    /* Extra styles not in styles.css */
    .filter-cat.active { background: var(--pink-dark); color: white; }
    .modal-backdrop { animation: fadeIn .15s ease; }
    @keyframes fadeIn { from { opacity:0 } to { opacity:1 } }
    .session-card-btn:hover { background: #fff6f9; }
    .toast.err { background: #c43f56; }
    .toast.ok  { background: #4c3440; }
    #bk-date, #s-date, #rs-date {
      border: 1px solid #f3d4df;
      border-radius: 11px;
      background: #fffafd;
      color: #392b31;
      padding: 7px 11px;
      outline: none;
      font-family: inherit;
      font-size: 13px;
    }
    #bk-status, #bk-search { font-family: inherit; font-size: 13px; }
    .detail-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px 20px; font-size: 13px; margin-bottom: 14px; }
    .muted { color: #a28c96; }
    .fw-600 { font-weight: 600; }
    select option { font-size: 13px; }
  </style>
</head>
<body>
  <div id="app">
    <div class="loading" style="margin-top:40vh">
      <div style="font-size:2rem;margin-bottom:12px">🌸</div>
      <div>Memuat Kinara Pilates Admin…</div>
    </div>
  </div>
  <script src="/js/app.js"></script>
</body>
</html>
